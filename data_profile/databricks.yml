# This is a Databricks asset bundle definition for data_profile.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: data_profile
  uuid: 35a3d91c-014d-423a-8873-5dfa0f4c25db

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1e6ae690-054b.cloud.databricks.com
    variables:
      catalog: sigmatic
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-1e6ae690-054b.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ahmed.raza@sigmaticanalytics.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ahmed.raza@sigmaticanalytics.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: sigmatic
      schema: prod
    permissions:
      - user_name: ahmed.raza@sigmaticanalytics.com
        level: CAN_MANAGE
